  - id: A13
    source: specs/server-groups/spec.md
    text: data migration Given an existing Moor database, when migrations run, then
      a `server_groups` table is created with columns `id TEXT PRIMARY KEY`,
      `name TEXT NOT NULL`, `sort_order INTEGER NOT NULL DEFAULT 0`, `created_at
      TEXT NOT NULL`, `updated_at TEXT NOT NULL`. A nullable `group_id TEXT`
      column is added to `mcp_servers`; existing servers keep `group_id` NULL
      (ungrouped). The migration is idempotent via `CREATE TABLE IF NOT EXISTS`,
      `ensure_column`, and `CREATE INDEX IF NOT EXISTS`, and may be run
      repeatedly without error. The existing `sort_order` backfill behavior does
      not regress.
    result: passed
