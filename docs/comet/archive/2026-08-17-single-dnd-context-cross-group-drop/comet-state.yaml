acceptance:
  - id: A1
    source: brief.md
    text:
      A1. 在 Servers 页面有一个空组(0 个 server)。把另一个分区的某个 server 拖到该空组的落点区域后,松开鼠标,该
      server 的 `groupId` 更新为该空组,卡片出现在该空组下。
    result: passed
    reason:
      text: "空组的 GroupDropArea(droppableId=group:<id>)现在挂载在 Servers.tsx 的单一外层
        DndContext 内;handleDragEnd 检测 group: 前缀,把 __ungrouped__ 映射为 null,调用
        handleAssignGroup -> updateServer 只写 groupId。静态推理验证通过。"
      truncated: false
  - id: A2
    source: brief.md
    text: A2. 在折叠分组(非空)上拖入其他分区的 server,松开后该 server 移入对应组,折叠状态不变。
    result: passed
    reason:
      text: "折叠组的 GroupDropArea(ServerGroupSection.tsx line 174)位于外层 DndContext 内,走同一
        group: 分支只写 groupId;折叠状态由 useCollapsedGroups 管理,拖拽处理器不触碰,保持不变。"
      truncated: false
  - id: A3
    source: brief.md
    text: A3. 同一分区内拖动 server 进行排序,仍按原 `onReorder` 写 `sort_order`,顺序持久化。
    result: passed
    reason:
      text:
        同组 server-to-server 拖拽进入 reorder 分支(181-213 行):分区内重排 + 块替换写回完整 servers
        列表,再 reorderServers -> PUT /api/servers/order。跨组 server-to-server(169
        行)只写 groupId,符合约束。
      truncated: false
  - id: A4
    source: brief.md
    text: A4. 列表视图与网格视图两种 `viewMode` 下,A1–A3 均成立。
    result: passed
    reason:
      text: ServerListView 与 ServerGridView 都精简为 SortableContext + useSortable 卡片,无内部
        DndContext;两者都作为 ServerGroupSection children 在同一外层 DndContext 内由
        viewMode 切换。一个 DndContext 下多个 SortableContext 是 dnd-kit 支持模式,各分区 id
        不相交,无冲突。
      truncated: false
  - id: A5
    source: brief.md
    text:
      A5. 拖到落点时,`GroupDropArea` 出现高亮(`isOver` 视觉态);松开后调用 `updateServer` 成功,失败时显示
      `ErrorBanner`。
    result: passed
    reason:
      text: GroupDropArea 用 useDroppable 在 isOver 时高亮(ServerGroupSection.tsx 40-47
        行);成功调用 updateServer,失败在 handleDragEnd 捕获并通过 setOrderError ->
        ErrorBanner(Servers.tsx 321 行)。
      truncated: false
  - id: A6
    source: brief.md
    text: A6. `pnpm build:frontend`(含 `tsc -b`)与 `pnpm lint` 退出码为 0;不引入新的 lint 警告。
    result: passed
    reason:
      text: 重跑:npx tsc -b --force 退出 0;npx vp lint src 退出 0,仅 ServerCard.test.tsx:11
        一个 preexisting as-any 警告(非本次改动);npx vp test run 退出 0,17 文件/94 测试通过。
      truncated: false
