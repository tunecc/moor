acceptance:
  - id: A1
    source: brief.md
    text: "**A1 网格使用 auto-fill 不拉伸**：`ServerGridView` 渲染的网格容器 `gridTemplateColumns`
      含 `auto-fill`（非 `auto-fit`），使未占满的行保留空轨道、卡片不拉伸。"
    result: passed
    reason:
      text: ServerGridView.tsx:74 gridTemplateColumns 使用 repeat(auto-fill, ...)；git
        diff 确认由 auto-fit 改为 auto-fill。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2 少量服务器留空对齐**：一个分组只有 1 或 2
      个服务器时，其卡片宽度与「占满一行的分组」的卡片宽度一致（同一列宽），剩余位置留空，而不是把 1–2 张卡片拉伸成整行。"
    result: passed
    reason:
      text:
        auto-fill + 固定 minmax 列宽是「未占满行留空不拉伸」的标准做法：浏览器按容器宽度与 min 轨道尺寸生成最多 3 列轨道，1–2
        张卡片只占前 1–2 轨道，剩余轨道保留为空、卡片宽度与占满行分组一致；auto-fit 才会折叠并拉伸。各分组各自渲染独立
        ServerGridView，但容器宽度一致（同页宽 + 同样 pl-1），故列数与列宽一致。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3 list 视图不回归**：list 视图仍为纵向堆叠，不引入网格列模板。"
    result: passed
    reason:
      text: ServerListView.tsx:78 仍为 space-y-2 纵向堆叠、无 grid 模板；git diff
        未触及该文件；Servers.tsx list 分支沿用 ServerListView。
      truncated: false
  - id: A4
    source: brief.md
    text:
      "**A4 具名分组显示 Stop all 按钮**：渲染 `ServerGroupSection`（非 Ungrouped）时，分区头操作区在
      Start all 旁包含一个 `Square` 图标按钮，`aria-label`/`title` 含 `Stop all servers in
      <name>`。"
    result: passed
    reason:
      text: ServerGroupSection.tsx:199-215 在 Start all 后渲染 Square
        图标按钮，title/aria-label 均为 Stop all servers in ${name}，hover 为 error-warm
        色。测试 renders a stop all button 通过。
      truncated: false
  - id: A5
    source: brief.md
    text:
      "**A5 Ungrouped 不显示 Stop all**：`isUngrouped` 为 true 时，分区头不渲染 Stop all（也不渲染
      Start all/上移/下移/重命名/删除）。"
    result: passed
    reason:
      text: Start all(182)/Stop all(199)/Move-Rename-Delete(216) 均以 !isUngrouped
        守卫；Servers.tsx 对 isUngrouped 传 onStopAll/onStartAll = undefined。测试 does
        not render ... for Ungrouped 通过。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6 Stop all 只停止运行中/启动中服务器**：给定分组内 server 状态分别为
      `running`、`starting`、`stopped`、`error`，点击 Stop all 后只对 `running` 和
      `starting` 的 server 调用一次 `onStopAll`（该回调内部并发调用各自的 `stopServer`），不重复触发
      `stopped`/`error`。"
    result: passed
    reason:
      text: Servers.tsx handleStopAll 调 getStoppableServerIds 后
        Promise.all(stopServer(id))；server-groups.ts 只过滤
        running/starting，stopped/error 排除。测试 returns only running and starting
        servers 通过。
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7 空组或无运行中服务器的 Stop all 禁用**：分组内 0 个 server，或所有 server 都为
      `stopped`/`error`，Stop all 按钮为 disabled。"
    result: passed
    reason:
      text: "Servers.tsx stopAllDisabled = isUngrouped ? true :
        getStoppableServerIds(...).length === 0。具名空组 onStopAll 有值→按钮渲染且
        disabled；全 stopped/error 同理。测试 disables stop all when stopAllDisabled is
        true 通过。"
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8 Stop all 点击不触发折叠**：点击 Stop all 按钮只执行停止逻辑，不调用 `onToggleCollapse`。"
    result: passed
    reason:
      text: ServerGroupSection.tsx:178-181 按钮区容器 onClick stopPropagation，Stop all
        在该容器内，点击不冒泡到 onToggleCollapse。测试 calls onStopAll once and does not
        toggle collapse 通过。
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9 Start all 行为不回归**：具名分组仍渲染 Start all（`Play` 图标，`Start all servers in
      <name>`），点击只启动 `stopped`/`error` 服务器，Ungrouped 不显示；Start all 与 Stop all
      各自独立 busy/disabled。"
    result: passed
    reason:
      text: Start all 用 Play 图标、Start all servers in ${name}；handleStartAll 走
        getStartableServerIds(stopped/error)；Ungrouped 传 undefined
        不渲染；startAllBusy/stopAllBusy 为独立
        useState，startAllDisabled/stopAllDisabled 独立计算。相关测试通过。
      truncated: false
  - id: A10
    source: brief.md
    text: "**A10 键盘与折叠不回归**：分区头整行点击/Enter/Space 折叠；Start all、Stop
      all、上移/下移/重命名/删除按钮点击或键盘激活时不触发折叠。"
    result: passed
    reason:
      text: handleHeaderKeyDown(148-154) 仅 event.target===event.currentTarget 时
        Enter/Space 折叠；按钮区 onClick stopPropagation(180)。toggles collapse / does
        not toggle collapse / Enter-Space / inner-control 四项测试通过。
      truncated: false
