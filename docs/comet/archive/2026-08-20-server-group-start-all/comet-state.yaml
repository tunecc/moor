acceptance:
  - id: A1
    source: brief.md
    text:
      "**A1 具名分组显示一键启动按钮**:渲染 `ServerGroupSection`(非 Ungrouped)时,分区头右侧操作区包含一个
      Play 图标按钮,`aria-label`/`title` 含 `Start all servers in <name>`。"
    result: passed
    reason:
      text: ServerGroupSection.tsx:166-178 renders a Play/Loader2 icon Button gated on
        `!isUngrouped && onStartAll`, with title/aria-label = `Start all servers
        in ${name}`. Servers.tsx:484-488 passes non-undefined onStartAll for
        named partitions. Test `renders a start all button for a named group`
        (test:76-81) asserts button exists and title matches.
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2 Ungrouped 不显示一键启动按钮**:`isUngrouped` 为 true 时,分区头不渲染 Start all
      按钮(也不渲染上移/下移/重命名/删除)。"
    result: passed
    reason:
      text: Start all gated by `!isUngrouped && onStartAll`
        (ServerGroupSection.tsx:166); move/rename/delete by `!isUngrouped` (line
        179); Servers.tsx:484-488 passes onStartAll=undefined for Ungrouped.
        Test `does not render start all, move, rename, or delete for Ungrouped`
        (test:83-89) asserts all absent.
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3 一键启动只启动可启动服务器**:给定分组内 server 状态分别为
      `stopped`、`error`、`running`、`starting`,点击 Start all 后只对 `stopped` 和
      `error` 的 server 调用一次 `onStartAll`(该回调内部并发调用各自的 `startServer`),不重复触发
      `running`/`starting`。"
    result: passed
    reason:
      text: Servers.tsx:194-200 handleStartAll calls getStartableServerIds then
        `Promise.all(startableIds.map(id => startServer(id)))` — concurrent,
        only stopped/error ids. server-groups.ts:49-53 filters to
        status==='stopped'||'error'. Lib tests confirm running/starting
        excluded; component test `calls onStartAll once` (test:96-108) confirms
        onStartAll called exactly once.
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4 空组或无可用服务器的按钮禁用**:分组内 0 个 server,或所有 server 都为
      `running`/`starting`,Start all 按钮为 disabled。"
    result: passed
    reason:
      text: Servers.tsx:489-496 computes startAllDisabled = `!partition.servers.some(s
        => s.status==='stopped'||s.status==='error')` for named groups, so empty
        group or all running/starting → disabled. ServerGroupSection.tsx:171
        `disabled={startAllBusy || startAllDisabled}`. Test `disables start all
        when startAllDisabled is true` (test:91-94) asserts
        button.disabled===true.
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5 按钮点击不触发折叠**:点击 Start all 按钮只执行启动逻辑,不调用 `onToggleCollapse`。"
    result: passed
    reason:
      text: Right-side ops wrapper div has `onClick={event =>
        event.stopPropagation()}` (ServerGroupSection.tsx:162-165), preventing
        bubbling to header onClick=onToggleCollapse (line 146). Test `calls
        onStartAll once and does not toggle collapse when clicked` (test:96-108)
        confirms onToggleCollapse not called.
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6 整行点击折叠/展开**:点击分区头名称/数量/空白区域调用 `onToggleCollapse`
      一次;点击上移/下移/重命名/删除按钮不调用 `onToggleCollapse`。"
    result: passed
    reason:
      text: Header div onClick=onToggleCollapse (line 146); name/count/blank are
        direct children so click bubbles and fires once. Functional buttons live
        inside the stopPropagation wrapper (lines 162-225). Tests `toggles
        collapse when the header row is clicked` and `does not toggle collapse
        when move controls are clicked` (test:112-136) confirm.
      truncated: false
  - id: A7
    source: brief.md
    text:
      "**A7 键盘折叠/展开**:分区头聚焦后按 Enter 或 Space 调用 `onToggleCollapse`;焦点在内部功能按钮时按
      Enter/Space 不触发分区折叠。"
    result: passed
    reason:
      text: handleHeaderKeyDown (ServerGroupSection.tsx:132-138) early-returns when
        `event.target !== event.currentTarget`, so key events on inner buttons
        do not toggle; Enter/Space on the header row itself calls
        onToggleCollapse. Tests `toggles collapse with Enter and Space` and
        `does not toggle collapse when keyboard events originate from an inner
        control` (test:138-159) confirm.
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8 折叠状态与图标不回归**:`collapsed` 为 true 显示 ChevronRight,false 显示
      ChevronDown;折叠时内容区按既有逻辑隐藏;`localStorage` 折叠状态逻辑不变。"
    result: passed
    reason:
      text: ChevronRight/ChevronDown swap on `collapsed`
        (ServerGroupSection.tsx:154-156); collapsed hides children (lines
        228-236). useCollapsedGroups.ts unchanged (git diff empty);
        Servers.tsx:461 still wires `onToggleCollapse={() =>
        toggleCollapsed(partition.id)}`. Test `keeps collapse icon and
        aria-expanded in sync` (test:161-171) asserts aria-expanded false/true.
      truncated: false
